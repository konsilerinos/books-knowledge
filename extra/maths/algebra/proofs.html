<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>proofs.typ</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        .pdf-viewer {
            width: 100%;
            height: calc(100vh - 101px); 
            border: 1px solid #e1e4e8;
            box-sizing: border-box;
            display: block;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="../../logo.jpg" alt="Logo" width="48" height="48" onerror="this.style.display='none'">
        <div class="breadcrumbs">
            <a href="../../index.html">Extra</a> / <a href="../index.html">maths</a> / <a href="index.html">algebra</a> / <span>proofs.typ</span>
        </div>
    </div>
    <div class="wrapped-content-container">
        <iframe id="pdfPlayer" class="pdf-viewer"></iframe>
    </div>
</div>

<script>
    function updatePdfSource() {
        const iframe = document.getElementById('pdfPlayer');
        const hash = window.location.hash;
        
        if (hash) {
            const targetLabel = hash.replace('#', '');
            iframe.src = "proofs.pdf#nameddest=" + encodeURIComponent(targetLabel) + "&toolbar=0&navpanes=0";
        } else {
            iframe.src = "proofs.pdf#toolbar=0&navpanes=0";
        }
    }

    window.addEventListener('DOMContentLoaded', updatePdfSource);
    window.addEventListener('hashchange', updatePdfSource);
</script>
</body>
</html>
